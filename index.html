<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>وهبة سيستم — إدارة محل الأثاث المنزلي</title>
  <meta name="description" content="نظام إدارة متكامل لمحل أثاث منزلي: مبيعات، نقطة بيع، مخزون، فواتير، عملاء وتقارير. نسخة تجريبية." />
  <meta name="theme-color" content="#f7f3ec" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237a5634'/%3E%3Cg fill='none' stroke='%23f7ecd9' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M8 22v-6a8 8 0 0 1 16 0v6'/%3E%3Cpath d='M6.5 22h19'/%3E%3Cpath d='M13 22v-3a3 3 0 0 1 6 0v3'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="التنقل الرئيسي">
      <div class="sidebar-head">
        <a class="brand" href="#/dashboard" aria-label="وهبة سيستم — لوحة التحكم">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 18.5v-6.2a7.5 7.5 0 0 1 15 0v6.2" />
              <path d="M2.8 18.5h18.4" />
              <path d="M9 18.5v-3.3a3 3 0 0 1 6 0v3.3" />
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-name">وهبة سيستم</span>
            <span class="brand-sub">أثاث منزلي فاخر</span>
          </span>
        </a>
      </div>

      <div class="side-scroll">
        <nav id="side-nav"></nav>
      </div>

      <div class="side-foot">
        <div class="store-card">
          <div class="store-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span>المعرض الرئيسي · جدة</span>
            <span class="store-dot" title="مفتوح الآن"></span>
          </div>
          <div class="store-meta">مفتوح حتى 11:00 م · وردية صباحية</div>
        </div>
        <div class="store-mini" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="shell">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-btn bordered sidebar-toggle" id="sidebar-toggle" aria-label="فتح القائمة" aria-expanded="false" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button class="icon-btn" id="collapse-btn" aria-label="تصغير القائمة الجانبية" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 9-3 3 3 3"/></svg>
          </button>
          <div class="crumb">
            <span>وهبة سيستم</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <b id="crumb-current">لوحة التحكم</b>
          </div>
        </div>

        <div class="topbar-end">
          <button class="search-trigger" id="search-trigger" aria-label="بحث سريع">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span>ابحث في النظام…</span>
            <kbd class="kbd">⌘K</kbd>
          </button>
          <button class="demo-pill" id="demo-guide" aria-haspopup="dialog">نسخة تجريبية</button>
          <button class="icon-btn bell" id="bell-btn" aria-label="الإشعارات" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="bell-dot" aria-hidden="true"></span>
          </button>
          <div class="divider" style="width:1px;height:26px;background:var(--border)"></div>
          <button class="user-chip" id="user-chip" aria-label="حساب المستخدم">
            <img class="user-avatar" src="assets/img/u-ahmed.jpg" alt="" />
            <span class="user-meta">
              <span class="user-name">أحمد وهبة</span>
              <span class="user-role">المدير العام</span>
            </span>
          </button>
        </div>
      </header>

      <main class="main" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
